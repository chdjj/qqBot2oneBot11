name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27.1"

jobs:
  # Fast feedback: format, vet and unit tests before spending time on binaries.
  test:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -count=1 ./...

  # Integration tests drive the real server against a mock QQ upstream.
  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装测试依赖
        working-directory: hack
        run: npm ci --no-fund --no-audit

      - name: 启动模拟上游
        run: |
          go build -o /tmp/mockupstream ./hack/mockupstream
          /tmp/mockupstream > /tmp/mock.log 2>&1 &

      - name: 启动适配器并运行传输测试
        env:
          QQBOT_API_BASE: http://127.0.0.1:19090
          QQBOT_TOKEN_URL: http://127.0.0.1:19090/app/getAppAccessToken
          QQBOT_TEST_INJECT: "1"
        run: |
          go build -o /tmp/qqbot-onebot ./cmd/qqbot-onebot
          # A fixed token keeps the checks below deterministic; the default
          # random one is what real deployments use.
          export ADMIN_TOKEN="ci-test-token-0123456789"
          /tmp/qqbot-onebot -addr 127.0.0.1:8080 -db /tmp/test.db -admin-token "$ADMIN_TOKEN" > /tmp/server.log 2>&1 &
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          # Wait for the console to answer rather than guessing a sleep.
          # /api/overview now needs auth, so use the login endpoint's 401 as the
          # liveness signal and the authorized call as the readiness check.
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' -H "Authorization: Bearer $ADMIN_TOKEN" \
                 http://127.0.0.1:8080/api/overview > /dev/null 2>&1; then
              echo "console ready"; break
            fi
            sleep 0.5
          done
          curl -fsS --noproxy '*' -X POST http://127.0.0.1:8080/api/bots \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"integration","app_id":"123456","secret":"test-secret","enabled":true,"intent_bits":[25]}'
          echo
          for i in $(seq 1 40); do
            if curl -fsS --noproxy '*' -H "Authorization: Bearer $ADMIN_TOKEN" \
                http://127.0.0.1:8080/api/bots | grep -q '"state":"online"'; then
              echo "gateway online"; break
            fi
            sleep 0.5
          done
          node hack/node-test.mjs
          node hack/ui-test.mjs
          node hack/login-intents-test.mjs

      - name: 未授权访问必须被拒绝
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --noproxy '*' http://127.0.0.1:8080/api/overview)
          echo "without token -> $code"
          if [ "$code" != "401" ]; then
            echo "管理接口未受保护"
            exit 1
          fi

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            /tmp/server.log
            /tmp/mock.log
          if-no-files-found: ignore

  # Cross-compile all release targets. CGO is off, so no cross toolchain needed.
  build:
    name: 编译 ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Only architectures supported by the pure-Go SQLite driver
        # (modernc.org/sqlite) are listed; e.g. mips64le does not build.
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: linux, goarch: "386", ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="qqbot-onebot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "\
            -s -w \
            -X qqbotonebot/internal/buildinfo.Version=${GITHUB_REF_NAME} \
            -X qqbotonebot/internal/buildinfo.Commit=${GITHUB_SHA::7} \
            -X qqbotonebot/internal/buildinfo.Date=$(date -u +%Y-%m-%d)" \
            -o "dist/$name" ./cmd/qqbot-onebot
          ls -lh "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: qqbot-onebot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Commit the freshly built binaries back into the repo as requested.
  # Only runs on pushes to main (never on PRs, and never on tag builds twice).
  # Publish binaries to GitHub Releases instead of committing them into the
  # repository. Every push to main updates a rolling "latest" release; tags
  # create their own versioned release.
  publish:
    name: 发布到 Releases
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # Tags are needed to work out the next version number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 计算下一个版本号
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "手动 tag，使用 $tag"
            exit 0
          fi

          # Auto-increment: the scheme is v0.N, so bump N by one.
          # Highest existing v0.N wins; numeric sort keeps v0.10 above v0.9.
          git fetch --tags --force --quiet || true
          highest=$(git tag -l 'v0.*' | sed -nE 's/^v0\.([0-9]+)$/\1/p' | sort -n | tail -1)
          next=$(( ${highest:-0} + 1 ))
          echo "tag=v0.$next" >> "$GITHUB_OUTPUT"
          echo "name=v0.$next" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "自动递增：${highest:+v0.$highest} -> v0.$next"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 发布版本 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

      # The rolling "latest" tag keeps a stable download URL for the newest
      # build, while the numbered tags give each release its own identity.
      - name: 同步 latest 标签
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（${{ steps.ver.outputs.short }}）
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: false