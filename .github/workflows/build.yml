name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27.1"

jobs:
  # Fast feedback: format, vet and unit tests before spending time on binaries.
  test:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test -count=1 ./...

  # Integration tests drive the real server against a mock QQ upstream.
  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装测试依赖
        working-directory: hack
        run: npm ci --no-fund --no-audit

      - name: 启动模拟上游
        run: |
          go build -o /tmp/mockupstream ./hack/mockupstream
          /tmp/mockupstream > /tmp/mock.log 2>&1 &

      - name: 启动适配器并运行传输测试
        env:
          QQBOT_API_BASE: http://127.0.0.1:19090
          QQBOT_TOKEN_URL: http://127.0.0.1:19090/app/getAppAccessToken
          QQBOT_TEST_INJECT: "1"
        run: |
          go build -o /tmp/qqbot-onebot ./cmd/qqbot-onebot
          /tmp/qqbot-onebot -addr 127.0.0.1:8080 -db /tmp/test.db > /tmp/server.log 2>&1 &
          # Wait for the console to answer rather than guessing a sleep.
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8080/api/overview > /dev/null 2>&1; then
              echo "console ready"; break
            fi
            sleep 0.5
          done
          curl -fsS --noproxy '*' -X POST http://127.0.0.1:8080/api/bots \
            -H 'Content-Type: application/json' \
            -d '{"name":"集成测试","app_id":"123456","secret":"test-secret","enabled":true}'
          echo
          for i in $(seq 1 40); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8080/api/bots | grep -q '"state":"online"'; then
              echo "gateway online"; break
            fi
            sleep 0.5
          done
          node hack/node-test.mjs
          node hack/ui-test.mjs

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            /tmp/server.log
            /tmp/mock.log
          if-no-files-found: ignore

  # Cross-compile all release targets. CGO is off, so no cross toolchain needed.
  build:
    name: 编译 ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Only architectures supported by the pure-Go SQLite driver
        # (modernc.org/sqlite) are listed; e.g. mips64le does not build.
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: linux, goarch: "386", ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="qqbot-onebot-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "\
            -s -w \
            -X qqbotonebot/internal/buildinfo.Version=${GITHUB_REF_NAME} \
            -X qqbotonebot/internal/buildinfo.Commit=${GITHUB_SHA::7} \
            -X qqbotonebot/internal/buildinfo.Date=$(date -u +%Y-%m-%d)" \
            -o "dist/$name" ./cmd/qqbot-onebot
          ls -lh "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: qqbot-onebot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Commit the freshly built binaries back into the repo as requested.
  # Only runs on pushes to main (never on PRs, and never on tag builds twice).
  publish:
    name: 提交编译产物
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Binaries live at the repo root so people can download a single
          # file straight from the repository page.
          for f in dist/*; do
            cp "$f" "./$(basename "$f")"
          done

          # The files must exist; the build matrix guarantees them.
          if ! ls qqbot-onebot-* >/dev/null 2>&1; then
            echo "没有找到编译产物，跳过提交"
            exit 0
          fi
          git add -f qqbot-onebot-* SHA256SUMS.txt

          if git diff --staged --quiet; then
            echo "二进制无变化，跳过提交"
            exit 0
          fi

          git commit -m "build: 自动编译产物" \
            -m "由 GitHub Actions 在 ${GITHUB_SHA::7} 上生成，构建号 ${GITHUB_RUN_NUMBER}。"

          # The commit made by GITHUB_TOKEN does not trigger new workflows, so
          # this push cannot loop.
          git push

  # On a tag, attach the same binaries to a GitHub Release.
  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验文件
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
